name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_prebuilt:
        description: Publish an already signed and verified APK
        type: boolean
        default: false
      asset_ref:
        description: Branch containing release-assets for the prebuilt APK
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Tests, lint and build
        run: ./gradlew --no-daemon :shared:test :app:testDebugUnitTest :wear:testDebugUnitTest :app:lintDebug :wear:lintDebug :app:assembleDebug :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            wear/build/reports/
            shared/build/reports/
          retention-days: 14


  pdf-device-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK and test APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Real PDF export, rendering and sharing on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p app/build/reports/device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w de.luca.mitfahrt.test/de.luca.mitfahrt.reports.ReportPdfInstrumentation | tee app/build/reports/device/result.txt
            grep -q 'PASS: PDF written' app/build/reports/device/result.txt
            adb exec-out run-as de.luca.mitfahrt cat files/reports/instrumented/share.png > app/build/reports/device/share.png
            adb exec-out run-as de.luca.mitfahrt tar -C files/reports -cf - instrumented > app/build/reports/device/pdf-reports.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-pdf-device-test
          path: app/build/reports/device/
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, pdf-device-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'ANDROID_KEYSTORE_BASE64 fehlt'; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/mitfahrt.jks"
          chmod 600 "$RUNNER_TEMP/mitfahrt.jks"
      - name: Signed release build
        env:
          MITFAHRT_KEYSTORE: ${{ runner.temp }}/mitfahrt.jks
          MITFAHRT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || 'android' }}
          MITFAHRT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          MITFAHRT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease
      - name: Create update manifest
        run: |
          python3 scripts/create_update_manifest.py --apk app/build/outputs/apk/release/app-release.apk --tag "$GITHUB_REF_NAME" --output dist
          python3 scripts/create_update_manifest.py --wear --apk wear/build/outputs/apk/release/wear-release.apk --tag "$GITHUB_REF_NAME" --output dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Mitfahrt $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mitfahrt.jks"

  publish-prebuilt:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prebuilt
    needs: [verify, pdf-device-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.asset_ref }}
          path: staged-release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Verify signed APK and recreate update manifest
        run: python3 scripts/verify_prebuilt.py staged-release/release-assets dist
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("dist/update.json"))["versionName"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Mitfahrt $VERSION" --notes-file RELEASE_NOTES.md
          fi
