name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Tests, lint and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports/
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'ANDROID_KEYSTORE_BASE64 fehlt'; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/mitfahrt.jks"
          chmod 600 "$RUNNER_TEMP/mitfahrt.jks"
      - name: Signed release build
        env:
          MITFAHRT_KEYSTORE: ${{ runner.temp }}/mitfahrt.jks
          MITFAHRT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || 'android' }}
          MITFAHRT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          MITFAHRT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Create update manifest
        run: python3 scripts/create_update_manifest.py --apk app/build/outputs/apk/release/app-release.apk --tag "$GITHUB_REF_NAME" --output dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Mitfahrt $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mitfahrt.jks"
